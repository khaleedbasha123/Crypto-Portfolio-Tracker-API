spring.application.name=Market_Data_Aggregator

coingecko.base-url=https://api.coingecko.com/api/v3
coingecko.connect-timeout-ms=3000
coingecko.read-timeout-ms=5000

spring.datasource.url=jdbc:postgresql://${host}:${port}/${database}?sslmode=require
spring.datasource.username=${username}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update